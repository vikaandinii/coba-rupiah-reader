<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="description" content="Rupiah Reader – Pemindai Uang Rupiah Cerdas bertenaga AI dengan visual modern, panduan audio id-ID, dan akurasi tinggi.">
  <title>Rupiah Reader – AI Money Scanner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13.0">
</head>
<body class="theme-modern">
  <a class="skip-link" href="#tap-fullscreen">Lewati ke area pemindai</a>

  <!-- Panggung Kamera Fullscreen -->
  <div id="camera-stage" class="camera-stage">
    <video id="camera-preview" autoplay playsinline muted></video>
    <div class="camera-ambient-overlay"></div>
    <canvas id="debug-overlay-canvas" class="debug-overlay-canvas" hidden></canvas>
    <canvas id="capture-canvas" hidden></canvas>
  </div>

  <!-- Area Sentuh Layar Penuh -->
  <button id="tap-fullscreen" class="tap-fullscreen-btn" type="button" aria-label="Ketuk layar di mana saja untuk memindai uang">
    
    <div id="viewfinder" class="viewfinder" style="border:none;">
      <!-- Laser Pindai Neon Ungu Berpendar -->
      <div id="laser-scanner" class="laser-scanner" aria-hidden="true">
        <div class="laser-beam"></div>
        <div class="laser-glow"></div>
      </div>

      <!-- Animasi Ceklis Sukses di Tengah -->
      <div id="success-badge" class="success-badge" aria-hidden="true">
        <div class="success-glow-halo"></div>
        <div class="success-rays">
          <span class="ray r-1"></span>
          <span class="ray r-2"></span>
          <span class="ray r-3"></span>
          <span class="ray r-4"></span>
        </div>
        <div class="success-circle">
          <svg class="check-svg" viewBox="0 0 24 24" fill="none">
            <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </button>

  <!-- Lapisan Antarmuka UI Terapung (Floating Glass Interface) -->
  <div class="floating-ui-layer">
    
    <!-- Top Navigation Bar (Frosted Circular Buttons) -->
    <header class="top-nav-bar">
      <button id="btn-back" class="nav-circle-btn" type="button" aria-label="Pindai Ulang">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Mini Chip Status Model AI -->
      <div id="ai-chip" class="ai-status-chip" role="status" title="Status Model">
        <span class="chip-pulse"></span>
        <span id="chip-text" class="chip-text">Custom CNN Ready</span>
      </div>

      <div class="top-actions-right">
        <!-- Tombol Ganti Kamera (Webcam Laptop <-> Kamera Belakang HP) -->
        <button id="btn-switch-cam" class="nav-circle-btn" type="button" aria-label="Ganti Kamera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
            <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m18 22-3-3 3-3"></path>
            <path d="m6 2 3 3-3 3"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tombol Zoom Melayang di Kiri Bawah (1x) -->
    <button id="btn-zoom" class="floating-zoom-btn" type="button" aria-label="Ganti Zoom Kamera">
      <span id="zoom-label">1x</span>
    </button>

    <!-- Floating Bottom Pill Card (Komponen Inti Sesuai GIF Referensi) -->
    <div id="bottom-card" class="bottom-pill-card state-idle" role="region" aria-live="polite">
      
      <!-- Slot Kiri: Ikon Dinamis (Reticle -> Spinner -> Thumbnail) -->
      <div id="pill-icon-slot" class="pill-icon-slot">
        
        <!-- Mode Idle: Kotak Ungu Lembut dengan Ikon Reticle -->
        <div id="icon-idle" class="icon-subview subview-idle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V5a1 1 0 0 1 1-1h3"></path>
            <path d="M16 4h3a1 1 0 0 1 1 1v3"></path>
            <path d="M4 16v3a1 1 0 0 0 1 1h3"></path>
            <path d="M16 20h3a1 1 0 0 0 1-1v-3"></path>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </div>

        <!-- Mode Scanning: Ring Spinner Berputar Halus -->
        <div id="icon-scanning" class="icon-subview subview-scanning">
          <div class="spinner-ring"></div>
        </div>

        <!-- Mode Result: Thumbnail Uang Realistis Sesuai Hasil Deteksi -->
        <div id="icon-result" class="icon-subview subview-result">
          <div id="banknote-thumbnail" class="banknote-thumbnail val-2000">
            <span class="thumb-watermark">IDR</span>
            <span id="thumb-number" class="thumb-number">2.000</span>
          </div>
        </div>
      </div>

      <!-- Slot Tengah: Teks Status & Nominal Uang -->
      <div class="pill-text-content">
        <span id="pill-subtitle" class="pill-subtitle">Siap Memindai (Otomatis Suara)</span>
        <span id="pill-title" class="pill-title">Arahkan Uang ke Kamera</span>
      </div>

      <!-- Slot Kanan: Tombol Flashlight / Senter Bulat Ungu -->
      <button id="btn-torch" class="pill-torch-btn" type="button" aria-label="Nyalakan senter kamera">
        <svg class="torch-svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 2h10a1 1 0 0 1 1 1v3.5a2 2 0 0 1-.6 1.4L15 10.3V21a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-10.7L6.6 7.9A2 2 0 0 1 6 6.5V3a1 1 0 0 1 1-1zm3 10v7h4v-7h-4zm-1-7v1.5l1.6 1.9a1 1 0 0 1 .4.6V9h4v-.01a1 1 0 0 1 .4-.58L16 6.5V5H9z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Screen reader live region -->
  <p id="sr-status" class="sr-only" aria-live="polite"></p>

  <!-- TensorFlow.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="script.js?v=15.0"></script>
</body>
</html>
